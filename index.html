<style>:root{--red:#c70c0f;--ink:#1c1c1c;--muted:#615b59;--rule:#e6e1df;--tint:#f8f6f5;--soft:#fbeaea}

a{color:var(--red)}h1,h2,h3,.e,.l,button,nav{font-family:Poppins,Arial,sans-serif}

.e{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
button{font-size:12px;font-weight:600;border:1px solid #ddd;background:#fff;color:#555;padding:7px 12px;border-radius:99px;cursor:pointer}
button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.r{font-size:13px;color:#666;text-transform:uppercase;letter-spacing:.05em;margin:16px 0 8px}.b{font-style:italic;color:#666;margin:0 0 8px}

.c{background:var(--ink);color:#fff;border-radius:10px;padding:18px;margin-top:26px}.c .l{color:#ff9c9d}.c b{display:block;font:600 19px/1.35 Poppins,Arial,sans-serif;margin:4px 0 6px}

.pager a small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}.pager a:last-child{text-align:right}
.x{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 30px}.x a{font:600 14px Poppins,Arial,sans-serif;text-decoration:none;padding:10px 16px;border-radius:99px;background:var(--red);color:#fff}
.x a+a{background:#fff;color:var(--ink);border:1px solid var(--ink)}

.list{list-style:none;padding:0;margin:0}.list li{border-bottom:1px solid var(--rule);padding:12px 0}.list a{text-decoration:none;color:var(--ink);font:600 16px/1.35 Poppins,Arial,sans-serif}
