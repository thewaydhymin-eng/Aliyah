name: Facebook – Check Page connection
# Run this once after saving the FACEBOOK_PAGE_TOKEN secret. It checks the key and shows which Page it posts to.
# It does not post anything.
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the Facebook Page key
        env:
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
        run: node tools/facebook.js check
