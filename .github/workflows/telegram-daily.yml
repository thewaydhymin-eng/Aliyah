name: Telegram – 2. Daily Aliyah
# Posts the new Aliyah (English, then Afrikaans) just after midnight South African time,
# when the website switches to the new day's Aliyah.
# Scheduled times are in UTC: "1 22 * * *" = 22:01 UTC = 00:01 SAST.
# GitHub sometimes starts scheduled runs late, so a back-up run at 02:31 SAST catches a missed post.
# It never posts twice: telegram/posted.json records each day that was posted.
# You can also post by hand: Actions tab → this workflow → Run workflow.
on:
  schedule:
    - cron: "1 22 * * *"
    - cron: "31 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Post again even if today was already posted"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: telegram
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Post today's Aliyah
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FORCE: ${{ inputs.force || 'false' }}
        run: node tools/telegram.js post
      - name: Remember that today was posted
        run: |
          git config user.name "aliyah-bot"
          git config user.email "aliyah-bot@users.noreply.github.com"
          git add telegram/posted.json 2>/dev/null || exit 0
          git commit -m "Telegram: posted $(TZ=Africa/Johannesburg date +%F)" || exit 0
          git pull --rebase && git push
