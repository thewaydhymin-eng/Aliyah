name: Telegram – 2. Daily Aliyah
# Posts the new Aliyah (English, then Afrikaans) just after midnight South African time,
# when the website switches to the new day's Aliyah.
# Scheduled times are in UTC: "1 22 * * *" = 22:01 UTC = 00:01 SAST.
# GitHub often starts scheduled runs hours late, so there are many tries between 00:01 and 03:31 SAST:
# the first one GitHub actually starts posts, and the rest see it was posted and do nothing.
# It never posts twice: telegram/posted.json records each day that was posted.
# You can also post by hand: Actions tab → this workflow → Run workflow.
on:
  schedule:
    - cron: "1 22 * * *"
    - cron: "13 22 * * *"
    - cron: "27 22 * * *"
    - cron: "41 22 * * *"
    - cron: "53 22 * * *"
    - cron: "7 23 * * *"
    - cron: "23 23 * * *"
    - cron: "37 23 * * *"
    - cron: "51 23 * * *"
    - cron: "11 0 * * *"
    - cron: "31 0 * * *"
    - cron: "57 0 * * *"
    - cron: "31 1 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Post again even if today was already posted"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: telegram
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Post today's Aliyah
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FORCE: ${{ inputs.force || 'false' }}
        run: node tools/telegram.js post
      - name: Remember that today was posted
        if: always()
        run: |
          git config user.name "aliyah-bot"
          git config user.email "aliyah-bot@users.noreply.github.com"
          git add telegram/posted.json
          git commit -m "Aliyah posted $(TZ=Africa/Johannesburg date +%F)" || exit 0
          git pull --rebase && git push
